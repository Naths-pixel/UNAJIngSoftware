server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ms_producto?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
